<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f34b91"><title>DeepLine Admin</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#ffd9e8,#f34b91);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#38202b;padding:24px}.wrap{max-width:760px;margin:5vh auto;background:#fff;border-radius:26px;padding:24px;box-shadow:0 18px 60px #a6295b33}h1{margin:0 0 6px;font-size:25px}p{color:#886b79}.panel{display:grid;gap:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff0f6;border-radius:17px;padding:16px}.stat b{display:block;font-size:24px;color:#e73583}label{font-size:14px;font-weight:650}input,select,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #f1c5d8;border-radius:12px;font:inherit;background:#fff}textarea{min-height:100px}button{border:0;border-radius:13px;background:#ed438c;color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#fce8f1;color:#a52b60}.row{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}.note{font-size:13px;color:#997b89}@media(max-width:560px){body{padding:12px}.wrap{padding:18px;margin:3vh auto}.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>♥ DeepLine Admin</h1><p>管理 API、公告和网站使用统计</p><section id="login" class="panel"><label>管理员密码<input id="password" type="password" autocomplete="current-password" placeholder="ADMIN_PASSWORD"></label><button id="loginBtn">登录管理后台</button><div id="loginMsg" class="note"></div></section><section id="admin" class="panel hidden"><div class="grid"><div class="stat">今日网站访问<b id="visits">0</b></div><div class="stat">今日 API 调用<b id="calls">0</b></div><div class="stat">今日 Token<b id="tokens">0</b></div></div><label>默认免费 API 服务商<select id="provider"><option>DeepSeek</option><option>Claude</option><option>豆包</option><option>ChatGPT / OpenAI</option></select></label><label>模型名称<input id="model" placeholder="deepseek-chat"></label><label>API Key<input id="apiKey" type="password" autocomplete="new-password" placeholder="输入要提供给用户的 API Key"></label><div class="row"><button id="saveConfig">保存默认 API</button><span id="configState" class="note"></span></div><label>网站公告<textarea id="announcement" maxlength="2000" placeholder="输入公告内容"></textarea></label><div class="row"><button id="saveAnnouncement">发布公告</button><button class="secondary" id="refresh">刷新统计</button><button class="secondary" id="logout">退出登录</button></div><p class="note">API Key 仅保存在服务器持久化 JSON 文件中，不会发送给普通用户或包含在用户 ZIP 备份里。统计从功能启用后开始累计；Token 以服务商响应的 usage 为准。</p></section></main><script src="/js/admin.js" defer></script></body></html>
