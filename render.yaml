# Render Blueprint — Persistent Disk stores only admin JSON config and usage stats.
services:
  - type: web
    name: deepline-web
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: deepline-admin-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
